<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plaza de la 41, Pereira: puestos y pedidos por WhatsApp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bitter:wght@600;800&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --fondo:#eef2f5; --tinta:#14283c; --sol:#f4b82e; --rojo:#b3261e;
  --verde:#1b7f4b; --papel:#ffffff; --suave:#5a6b7b;
  --slab:"Bitter","Rockwell","Georgia",serif;
  --texto:"Source Sans 3","Segoe UI",Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--fondo);color:var(--tinta);font:400 1.125rem/1.55 var(--texto)}
.toldo{height:22px;background:repeating-linear-gradient(90deg,var(--sol) 0 28px,var(--tinta) 28px 56px)}
header{padding:28px 20px 8px;max-width:640px;margin:0 auto}
h1{font:800 clamp(2rem,8vw,2.8rem)/1.1 var(--slab);margin:0 0 10px}
header p{margin:0;max-width:34ch}
main{max-width:640px;margin:0 auto;padding:16px 20px 40px;display:grid;gap:28px}
.puesto{background:var(--papel);border:2px solid var(--tinta);border-radius:6px;overflow:hidden}
.foto{position:relative;aspect-ratio:16/10;background:var(--tinta)}
.foto img{width:100%;height:100%;object-fit:cover;display:block}
.foto.sinfoto{background:repeating-linear-gradient(135deg,var(--tinta) 0 18px,#1f3a55 18px 36px)}
.estado{position:absolute;left:12px;bottom:12px;padding:6px 12px;border-radius:4px;font-weight:700;font-size:1rem;background:var(--papel);border:2px solid var(--tinta)}
.estado.abierto{background:var(--verde);color:#fff;border-color:var(--verde)}
.cuerpo{padding:18px 18px 20px}
.placa{display:inline-block;background:var(--sol);border:2px solid var(--tinta);padding:2px 12px;font:800 1.5rem/1.3 var(--slab);margin-bottom:12px}
h2{font:800 1.6rem/1.2 var(--slab);margin:0 0 6px}
.dato{margin:0 0 4px;color:var(--suave)}
.dato b{color:var(--tinta)}
.lista{margin:16px 0 4px;padding:0;list-style:none;border-top:2px solid var(--tinta)}
.lista li{display:flex;align-items:baseline;gap:8px;padding:9px 0;border-bottom:1px dashed #b9c4ce}
.lista .n{flex:1}
.lista .p{font:800 1.2rem var(--slab);color:var(--rojo);white-space:nowrap}
.nota{font-size:1rem;color:var(--suave);margin:8px 0 0}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:18px;min-height:60px;padding:12px 16px;background:var(--verde);color:#fff;text-decoration:none;font:700 1.2rem var(--texto);border-radius:6px}
.btn:hover{background:#166b3f}
.btn:focus-visible{outline:4px solid var(--sol);outline-offset:3px}
.btn svg{width:26px;height:26px;fill:#fff;flex:none}
footer{max-width:640px;margin:0 auto;padding:0 20px 40px;color:var(--suave);font-size:1rem}
</style>
</head>
<body>
<div class="toldo" aria-hidden="true"></div>
<header>
  <h1>Plaza de la 41, Pereira</h1>
  <p>Encuentra el puesto, mira el horario y haz tu pedido por WhatsApp.</p>
</header>
<main id="puestos"></main>
<footer>Los precios pueden cambiar. Confirma por WhatsApp la cantidad y el valor de tu pedido.</footer>

<script>
var PUESTOS = [
  { nombre:"Nancy Ramirez", local:"1-275", abre:6, cierra:12, horario:"6:00 a. m. a 12:00 m.",
    tel:"573145755619", telVisible:"314 575 5619", foto:"puesto-nancy.jpg",
    vende:"Menudo de cerdo e insumos para hacer morcilla",
    precios:[["Menudo de cerdo sencillo","$22.000"],["Tripa delgada","$17.000"],["Buche","$2.000"],
             ["Tripa central","$2.000"],["Bolsa de sangre adicional","$3.000"],
             ["Kilo de empeya","$9.000"],["Kilo de entrecijo","$6.000"]] },
  { nombre:"Walter Aguirre", local:"1-279", abre:4, cierra:12, horario:"4:00 a. m. a 12:00 m.",
    tel:"573103721617", telVisible:"310 372 1617", foto:"puesto-walter.jpg", precios:null },
  { nombre:"Pikachu", local:"1-278", abre:4, cierra:12, horario:"4:00 a. m. a 12:00 m.",
    tel:"573166822391", telVisible:"316 682 2391", foto:"puesto-sebastian.jpg", precios:null }
];

var ICONO = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 3h16a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H9l-5 4v-4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/></svg>';

function horaBogota(){
  var p = new Intl.DateTimeFormat("en-GB",{hour:"numeric",minute:"numeric",hour12:false,timeZone:"America/Bogota"}).formatToParts(new Date());
  var h = 0, m = 0;
  p.forEach(function(x){ if(x.type==="hour") h = parseInt(x.value,10)%24; if(x.type==="minute") m = parseInt(x.value,10); });
  return h + m/60;
}

function esc(t){ return String(t).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }

function tarjeta(p){
  var t = horaBogota();
  var abierto = t >= p.abre && t < p.cierra;
  var estado = abierto ? "Abierto ahora" : "Cerrado ahora";
  var msg = encodeURIComponent("Hola " + p.nombre.split(" ")[0] + ", vi tu puesto en la página de la Plaza de la 41 y quiero hacer un pedido.");
  var precios = "";
  if(p.precios){
    precios = '<ul class="lista">' + p.precios.map(function(x){
      return '<li><span class="n">'+esc(x[0])+'</span><span class="p">'+esc(x[1])+'</span></li>';
    }).join("") + '</ul>';
  } else {
    precios = '<p class="nota">Pregunta por los productos y precios directamente por WhatsApp.</p>';
  }
  return '<article class="puesto">' +
    '<div class="foto"><img src="'+esc(p.foto)+'" alt="Puesto de '+esc(p.nombre)+'" loading="lazy" onerror="this.parentNode.classList.add(\'sinfoto\');this.remove()">' +
    '<span class="estado'+(abierto?' abierto':'')+'">'+estado+'</span></div>' +
    '<div class="cuerpo"><div class="placa">Local '+esc(p.local)+'</div>' +
    '<h2>'+esc(p.nombre)+'</h2>' +
    (p.vende ? '<p class="dato">'+esc(p.vende)+'</p>' : '') +
    '<p class="dato"><b>Atiende:</b> '+esc(p.horario)+'</p>' +
    '<p class="dato"><b>Teléfono:</b> '+esc(p.telVisible)+'</p>' +
    precios +
    '<a class="btn" href="https://wa.me/'+p.tel+'?text='+msg+'">'+ICONO+'Pedir por WhatsApp</a>' +
    '</div></article>';
}

document.getElementById("puestos").innerHTML = PUESTOS.map(tarjeta).join("");
</script>
</body>
</html>
